<h2 mat-dialog-title>New Test Scenario</h2>

<mat-dialog-content>
    <form class="form-container" [formGroup]="editForm">
        <mat-form-field>
            <mat-label>Scenario Name</mat-label>
            <input matInput formControlName="name">
        </mat-form-field>

        <div>
            <label for="file-upload" class="control-label">Script (.jmx)</label>
            <br/>
            <input id="file-upload" type="file" (change)="onFileChange($event)" accept=".jmx">
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button [mat-dialog-close]="getSaveData()" [disabled]="!editForm.valid">Save</button>
</mat-dialog-actions>
