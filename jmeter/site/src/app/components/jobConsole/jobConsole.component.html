<div class="page-container" *ngIf="job">
    <div class="page-header">
        <h3 class="page-title">Job Console</h3>
        <div class="header-actions">
            <button mat-flat-button color="primary" [disabled]="job.status !== '0'" (click)="run()">Start</button>
            <button mat-flat-button color="warn" [disabled]="job.status !== '1'" (click)="terminate()">Terminate</button>
            <button mat-flat-button [disabled]="job.status !== '2'" (click)="restart()">Restart</button>
            <button mat-stroked-button [disabled]="job.status !== '2'" (click)="report()">View Report</button>
        </div>
    </div>
    <div class="page-content">
        <mat-tab-group>
            <mat-tab label="Scenario Name">
                <p>{{job.scenarioName}}</p>
            </mat-tab>
            <mat-tab label="Script(jmx)">
                <p>{{job.scenarioScriptName}}</p>
            </mat-tab>
            <mat-tab label="Min Heap Size">
                <p>{{job.minHeap}}</p>
            </mat-tab>
            <mat-tab label="Max Heap Size">
                <p>{{job.maxHeap}}</p>
            </mat-tab>
            <mat-tab label="Properties">
                <p [innerHTML]="job.config | jsonFilter"></p>
            </mat-tab>
            <mat-tab label="Remote Host" *ngIf="job.executeType === '1'">
                <p [innerHTML]="job.remoteHost | commaFilter"></p>
            </mat-tab>
        </mat-tab-group>

        <div #scrollContainer *ngIf="job && (firstStartup || job.status !== '2')" class="console-output">
            <p *ngFor="let line of lines">{{line}}</p>
            <div class="spinner-container" *ngIf="job.status === '1'">
                <mat-spinner diameter="32"></mat-spinner>
            </div>
        </div>
    </div>
</div>
