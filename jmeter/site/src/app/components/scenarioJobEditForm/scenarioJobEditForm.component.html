<h2 mat-dialog-title>New Test Job</h2>

<mat-dialog-content>
    <form [formGroup]="editForm" class="form-container">
        <div class="heap-inputs">
            <mat-form-field>
                <mat-label>xms (e.g., 1024m)</mat-label>
                <input matInput formControlName="minHeap">
            </mat-form-field>
            <mat-form-field>
                <mat-label>xmx (e.g., 2048m)</mat-label>
                <input matInput formControlName="maxHeap">
            </mat-form-field>
        </div>

        <mat-radio-group formControlName="executeType">
            <mat-radio-button value="0">Local</mat-radio-button>
            <mat-radio-button value="1">Remote</mat-radio-button>
        </mat-radio-group>

        <mat-tab-group>
            <mat-tab label="Properties">
                <div formArrayName="configs">
                    <div *ngFor="let group of configs.controls; let i=index" [formGroupName]="i" class="property-row">
                        <mat-form-field>
                            <mat-label>Key</mat-label>
                            <input matInput formControlName="key">
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>Value</mat-label>
                            <input matInput formControlName="value">
                        </mat-form-field>
                        <button mat-icon-button (click)="deleteConfig(i)">
                            <mat-icon>remove_circle</mat-icon>
                        </button>
                    </div>
                    <button mat-stroked-button (click)="addConfig()">Add Property</button>
                </div>
            </mat-tab>
            <mat-tab label="Remote Hosts" *ngIf="editForm.value.executeType === '1'">
                <div formArrayName="remoteHosts">
                    <div *ngFor="let group of remoteHosts.controls; let i=index" [formGroupName]="i" class="host-row">
                         <mat-form-field>
                            <mat-label>Host</mat-label>
                            <input matInput formControlName="remoteHost">
                        </mat-form-field>
                        <button mat-icon-button (click)="deleteRemoteHost(i)" *ngIf="remoteHosts.controls.length > 1">
                            <mat-icon>remove_circle</mat-icon>
                        </button>
                    </div>
                    <button mat-stroked-button (click)="addRemoteHost()">Add Host</button>
                </div>
            </mat-tab>
        </mat-tab-group>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button [mat-dialog-close]="getSaveData()" [disabled]="!editForm.valid">Save</button>
</mat-dialog-actions>
