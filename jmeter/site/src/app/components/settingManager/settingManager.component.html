<div class="page-container">
    <div class="page-header">
        <h3 class="page-title">Setting</h3>
    </div>

    <div class="page-content">
        <form [formGroup]="editForm" class="form-container">
            <mat-radio-group formControlName="executeType">
                <mat-label>Execute Type</mat-label>
                <mat-radio-button value="0">Local</mat-radio-button>
                <mat-radio-button value="1">Remote</mat-radio-button>
            </mat-radio-group>

            <div *ngIf="editForm.value.executeType === '1'" formArrayName="remoteHosts">
                <h4>Remote Hosts</h4>
                <div *ngFor="let group of remoteHosts.controls; let i=index" [formGroupName]="i" class="host-row">
                    <mat-form-field>
                        <mat-label>Host</mat-label>
                        <input matInput formControlName="remoteHost">
                    </mat-form-field>
                    <button mat-icon-button (click)="deleteRemoteHost(i)" *ngIf="remoteHosts.controls.length > 1">
                        <mat-icon>remove_circle</mat-icon>
                    </button>
                </div>
                <button mat-stroked-button (click)="addRemoteHost()">Add Host</button>
            </div>
        </form>
        <div class="actions">
            <button mat-flat-button color="primary" [disabled]="!editForm.valid" (click)="onSave()">Save</button>
        </div>
    </div>
</div>
