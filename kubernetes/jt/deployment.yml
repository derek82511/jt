apiVersion: apps/v1
kind: Deployment
metadata:
  name: jt
  labels:
    app: jt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jt
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: jt
    spec:
      initContainers:
        - command:
            - sh
            - '-c'
            - |
              sysctl -w net.ipv4.tcp_fin_timeout=30
              sysctl -w net.ipv4.tcp_tw_reuse=1
          image: busybox
          imagePullPolicy: IfNotPresent
          name: setsysctl
          securityContext:
            privileged: true
      containers:
        - env:
            - name: TZ
              value: Asia/Taipei
            - name: SERVER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          name: jt
          image: derek82511/jt:2.0.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: '2'
              memory: 5120Mi
      nodeSelector:
        jt: 'master'
